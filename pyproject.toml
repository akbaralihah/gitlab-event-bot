[project]
name = "gitlab-event-bot"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "redis==8.1.0",
    "sqladmin==0.32.0",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
